spring.application.name=taskflow

# In-memory H2: no database installation needed. Data is lost on shutdown.
spring.datasource.url=jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Require enum names such as "TODO" instead of numeric enum positions.
spring.jackson.deserialization.fail-on-numbers-for-enums=true

springdoc.paths-to-match=/api/tasks/**
# Document errors explicitly on the controller instead of adding every advice response to every route.
springdoc.override-with-generic-response=false
